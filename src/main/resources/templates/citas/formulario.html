<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Formulario de Cita Médica')}"></head>
<body>
<header th:replace="~{fragments/comunes :: navbar}"></header>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="text-primary mb-3" th:text="${cita.id == null ? 'Nueva Cita Médica' : 'Editar Cita Médica'}">Cita</h4>

                    <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Nombre del Paciente</label>
                            <input type="text" class="form-control" th:field="*{pacienteNombre}" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Especialidad</label>
                            <input type="text" class="form-control" th:field="*{especialidad}" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha de la Cita</label>
                            <input type="date" class="form-control" th:field="*{fecha}" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Costo</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{costo}" required />
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input" th:field="*{activa}" />
                            <label class="form-check-label">Activa</label>
                        </div>

                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/citas}">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
</body>
</html>
