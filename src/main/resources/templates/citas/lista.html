<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/comunes :: cabecera('Gestión de Citas Médicas')}"></head>
<body>
<header th:replace="~{fragments/comunes :: navbar}"></header>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary">Citas Médicas</h2>
        <a class="btn btn-primary" th:href="@{/citas/nueva}" sec:authorize="hasAnyRole('ADMIN','MEDICO')">+ Nueva Cita</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Paciente</th>
                        <th>Especialidad</th>
                        <th>Fecha</th>
                        <th>Costo</th>
                        <th>Estado</th>
                        <th class="text-end" sec:authorize="hasAnyRole('ADMIN','MEDICO')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cita : ${citas}">
                        <td th:text="${cita.id}">1</td>
                        <td th:text="${cita.pacienteNombre}">Paciente</td>
                        <td th:text="${cita.especialidad}">Especialidad</td>
                        <td th:text="${cita.fecha}">2026-01-01</td>
                        <td th:text="${'₡' + cita.costo}">₡0</td>
                        <td>
                            <span th:if="${cita.activa}" class="badge bg-success">Activa</span>
                            <span th:unless="${cita.activa}" class="badge bg-secondary">Inactiva</span>
                        </td>
                        <td class="text-end" sec:authorize="hasAnyRole('ADMIN','MEDICO')">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/citas/editar/{id}(id=${cita.id})}">Editar</a>
                            <form th:action="@{/citas/eliminar/{id}(id=${cita.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar esta cita médica?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(citas)}">
                        <td colspan="7" class="text-center text-muted py-3">No hay citas médicas registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
</body>
</html>
