<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Detalle de Usuario')}"></head>
<body>
<header th:replace="~{fragments/comunes :: navbar}"></header>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="text-primary mb-3">Detalle de Usuario</h4>
                    <dl class="row mb-0">
                        <dt class="col-sm-4">ID</dt>
                        <dd class="col-sm-8" th:text="${usuario.id}">1</dd>

                        <dt class="col-sm-4">Nombre</dt>
                        <dd class="col-sm-8" th:text="${usuario.nombre}">Nombre</dd>

                        <dt class="col-sm-4">Email</dt>
                        <dd class="col-sm-8" th:text="${usuario.email}">correo@medicare.com</dd>

                        <dt class="col-sm-4">Rol</dt>
                        <dd class="col-sm-8" th:text="${usuario.rol != null ? usuario.rol.nombre : '-'}">ROL</dd>

                        <dt class="col-sm-4">Activo</dt>
                        <dd class="col-sm-8" th:text="${usuario.activo ? 'Sí' : 'No'}">Sí</dd>

                        <dt class="col-sm-4">Fecha de Creación</dt>
                        <dd class="col-sm-8" th:text="${usuario.fechaCreacion}">2026-01-01</dd>
                    </dl>
                    <a class="btn btn-outline-secondary mt-3" th:href="@{/usuarios}">Volver</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
</body>
</html>
