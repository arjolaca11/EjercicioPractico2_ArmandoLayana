<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Gestión de Usuarios')}"></head>
<body>
<header th:replace="~{fragments/comunes :: navbar}"></header>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary">Gestión de Usuarios</h2>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">+ Nuevo Usuario</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Activo</th>
                        <th>Fecha Creación</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario, iterUsuarios : ${usuarios}">
                        <td th:text="${iterUsuarios.count}">1</td>
                        <td th:text="${usuario.nombre}">Nombre</td>
                        <td th:text="${usuario.email}">correo@medicare.com</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${usuario.rol != null ? usuario.rol.nombre : '-'}">ROL</span>
                        </td>
                        <td>
                            <span th:if="${usuario.activo}" class="badge bg-success">Sí</span>
                            <span th:unless="${usuario.activo}" class="badge bg-danger">No</span>
                        </td>
                        <td th:text="${usuario.fechaCreacion}">2026-01-01</td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/usuarios/detalle/{id}(id=${usuario.id})}">Ver</a>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                            <form th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este usuario?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center text-muted py-3">No hay usuarios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
</body>
</html>
