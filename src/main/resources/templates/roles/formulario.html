<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Formulario de Rol')}"></head>
<body>
<header th:replace="~{fragments/comunes :: navbar}"></header>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="text-primary mb-3" th:text="${rol.id == null ? 'Nuevo Rol' : 'Editar Rol'}">Rol</h4>

                    <form th:action="@{/roles/guardar}" th:object="${rol}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        <div class="mb-3">
                            <label class="form-label">Nombre del rol</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required />
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/roles}">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
</body>
</html>
