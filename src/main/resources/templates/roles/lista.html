<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Gestión de Roles')}"></head>
<body>
<header th:replace="~{fragments/comunes :: navbar}"></header>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary">Gestión de Roles</h2>
        <a class="btn btn-primary" th:href="@{/roles/nuevo}">+ Nuevo Rol</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rol, iterRoles : ${roles}">
                        <td th:text="${iterRoles.count}">1</td>
                        <td th:text="${rol.nombre}">ADMIN</td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/roles/editar/{id}(id=${rol.id})}">Editar</a>
                            <form th:action="@{/roles/eliminar/{id}(id=${rol.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este rol?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roles)}">
                        <td colspan="3" class="text-center text-muted py-3">No hay roles registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
</body>
</html>
