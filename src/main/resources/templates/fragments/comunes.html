<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<!--/* Fragmento de cabecera reutilizable: título + Bootstrap */-->
<th:block th:fragment="cabecera(titulo)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${titulo} + ' · MediCare'">MediCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer="defer"></script>
    <style>
        :root {
            --bs-primary: #0d7d72;
            --bs-primary-rgb: 13, 125, 114;
            --bs-primary-text-emphasis: #0a5148;
            --bs-primary-bg-subtle: #dcf1ee;
            --bs-primary-border-subtle: #aedcd5;
            --bs-link-color: #0d7d72;
            --bs-link-hover-color: #0a5148;
            --mc-ink: #1f2937;
            --mc-muted: #64748b;
            --mc-bg: #f3f6f8;
            --mc-border: #e4e9ee;
        }

        body {
            background-color: var(--mc-bg);
            color: var(--mc-ink);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        h1, h2, h3, h4, h5, .navbar-brand {
            font-weight: 600;
        }

        /* Navbar */
        .navbar-brand {
            letter-spacing: .3px;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .navbar-brand::before {
            content: "";
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255,255,255,.35);
        }
        .navbar .nav-link {
            border-radius: .4rem;
            padding: .5rem .8rem;
            transition: background-color .15s ease, color .15s ease;
        }
        .navbar .nav-link:hover,
        .navbar .nav-link:focus {
            background-color: rgba(255,255,255,.12);
            color: #ffffff;
        }
        .navbar .btn-outline-light:hover {
            transform: translateY(-1px);
        }

        /* Tarjetas */
        .card {
            border: 1px solid var(--mc-border);
            border-radius: .75rem;
            transition: box-shadow .2s ease, transform .2s ease;
        }
        .card:hover {
            box-shadow: 0 .75rem 1.5rem rgba(15, 23, 42, .08);
            transform: translateY(-2px);
        }

        /* Tablas */
        .table {
            --bs-table-hover-bg: var(--bs-primary-bg-subtle);
        }
        .table thead th {
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--bs-primary-text-emphasis);
            border-bottom-width: 2px;
        }
        .table-hover > tbody > tr {
            transition: background-color .12s ease;
        }
        .table > :not(caption) > * > * {
            vertical-align: middle;
        }

        /* Botones */
        .btn {
            border-radius: .5rem;
            font-weight: 500;
            transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-primary:hover,
        .btn-primary:focus {
            background-color: var(--bs-primary-text-emphasis);
            border-color: var(--bs-primary-text-emphasis);
            box-shadow: 0 .35rem .75rem rgba(13, 125, 114, .28);
        }
        .btn-outline-primary {
            color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-outline-primary:hover,
        .btn-outline-primary:focus {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }

        /* Formularios */
        .form-control:focus,
        .form-select:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 .2rem rgba(13, 125, 114, .15);
        }

        /* Badges */
        .badge {
            font-weight: 500;
            letter-spacing: .02em;
        }

        footer {
            color: var(--mc-muted);
        }
    </style>
</th:block>
</head>
<body>

<!--/* Fragmento de barra de navegación reutilizable */-->
<nav th:fragment="navbar" class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">MediCare</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/roles}">Roles</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/citas}">Citas Médicas</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/consultas}">Consultas Avanzadas</a>
                </li>
            </ul>
            <ul class="navbar-nav border-top border-light border-opacity-25 mt-2 pt-2">
                <li class="nav-item d-flex align-items-center py-1 text-white-50" sec:authorize="isAuthenticated()">
                    <small>Sesión: <span sec:authentication="name">usuario</span></small>
                </li>
                <li class="nav-item py-1" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Iniciar sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!--/* Fragmento de pie de página reutilizable */-->
<footer th:fragment="footer" class="text-center py-4 mt-5 border-top">
    <small>&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> MediCare - Gestión de Citas Médicas y Usuarios</small>
</footer>

</body>
</html>
